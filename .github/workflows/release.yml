name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a tagged commit from main
        run: git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build release package
        run: npm run release:package -- --tag "$GITHUB_REF_NAME"
      - name: Inspect release package
        run: |
          unzip -t "release/hoby-${GITHUB_REF_NAME}.zip"
          unzip -Z1 "release/hoby-${GITHUB_REF_NAME}.zip"
          (cd release && sha256sum --check "hoby-${GITHUB_REF_NAME}.zip.sha256")
      - name: Upload immutable release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hoby-${{ github.ref_name }}
          path: |
            release/hoby-${{ github.ref_name }}.zip
            release/hoby-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Submit to Chrome Web Store
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: chrome-web-store
      url: https://chromewebstore.google.com/detail/${{ vars.CWS_EXTENSION_ID }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hoby-${{ github.ref_name }}
          path: release
      - name: Verify artifact checksum
        run: (cd release && sha256sum --check "hoby-${GITHUB_REF_NAME}.zip.sha256")
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Authenticate to Google Cloud without a stored key
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          CWS_RELEASE_VERSION="${CWS_RELEASE_VERSION#v}" \
            node scripts/publish-chrome-web-store.mjs "release/hoby-${GITHUB_REF_NAME}.zip"

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download submitted release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hoby-${{ github.ref_name }}
          path: release
      - name: Create release with generated notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/hoby-${GITHUB_REF_NAME}.zip" \
            "release/hoby-${GITHUB_REF_NAME}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Hoby ${GITHUB_REF_NAME}" \
            --notes "Submitted to Chrome Web Store for review. This release does not indicate Google approval or live availability." \
            --generate-notes
