name: Bug report
description: Report reproducible incorrect behavior in Hoby.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before reporting, search existing issues and remove private URLs or browsing data from logs and screenshots.
  - type: input
    id: version
    attributes:
      label: Hoby version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Chrome and operating system
      placeholder: Chrome 140, macOS 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or logs if useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed private URLs, tokens, and personal browsing data.
          required: true
        - label: This is not a security vulnerability.
          required: true
