name: Feature request
description: Propose a focused improvement to Hoby.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: privacy
    attributes:
      label: Does this require new browser permissions, an account, or a network service?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
